name: Deploy homepage

on:
  push:
    branches: [main]
    paths:
      - "examples/code-research-demo/**"
      - ".github/workflows/pages.yml"
      - "scripts/version_homepage_assets.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Version homepage assets
        run: node scripts/version_homepage_assets.mjs
      - name: Upload homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: examples/code-research-demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
